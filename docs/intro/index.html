<script>

function enter(q,delay,draw){const p=ease((q-delay)/.85);g.save();g.globalAlpha*=p;g.translate(0,28*(1-p));draw();g.restore()}
function line(x1,y1,x2,y2,p=1,color=C.cyan){g.strokeStyle=color;g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x1+(x2-x1)*clamp(p),y1+(y2-y1)*clamp(p));g.stroke();if(p>=1){g.beginPath();g.moveTo(x2-10,y2-8);g.lineTo(x2,y2);g.lineTo(x2-10,y2+8);g.stroke()}}
function node(x,y,w,h,k,title,sub,color=C.cyan){box(x,y,w,h);box(x,y,w,54,'#14273b',null,24);txt(k,x+24,y+35,20,color,700);txt(title,x+24,y+108,32,C.white,600,'left',w-48);if(sub)txt(sub,x+24,y+154,22,C.muted,400,'left',w-48);g.fillStyle=color;g.beginPath();g.arc(x+w,y+h/2,7,0,Math.PI*2);g.fill()}
function glow(x,y,r,color){const grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,color);grad.addColorStop(1,'#00000000');g.fillStyle=grad;g.fillRect(x-r,y-r,r*2,r*2)}
function bg(t,scene){g.fillStyle=C.bg;g.fillRect(0,0,W,H);glow(1450+Math.sin(t*.23)*90,240,660,'#4b387128');glow(400,900,680,'#185e5b24');g.lineWidth=1;g.strokeStyle='#182338';for(let x=0;x<W;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}box(96,64,46,46,C.cyan,null,13);txt('61',119,96,22,C.bg,800,'center');txt('design61 / TOOLS',160,95,25,C.white,600);txt('功能示意动画',1820,95,22,C.muted,400,'right');g.fillStyle='#172538';g.fillRect(100,984,1720,3);g.fillStyle=C.cyan;g.fillRect(100,984,1720*clamp(t/36),3);const labels=['自由采样','3 + 5 双采','序列与 Review','素材随段走','文件夹工具','立即开始'];labels.forEach((s,i)=>{txt(String(i+1).padStart(2,'0'),100+i*286,1040,16,i===scene?C.cyan:C.muted,600);txt(s,136+i*286,1040,20,i===scene?C.white:C.muted)})}

function close(q){enter(q,0,()=>{pill('BUILT FOR YOUR WORKFLOW',100,210,402);txt('六个节点',100,349,90,C.white,700);txt('更多创作空间',100,460,90,C.cyan,700);txt('采样自由组合，续写自动推进。',100,553,34,C.muted);const names=['Sequence Start','Conditioning','Prepare','Sequence End'];names.forEach((v,i)=>{box(100+(i%2)*395,619+Math.floor(i/2)*88,367,65,'#14263a');txt(v+' _design61',123+(i%2)*395,661+Math.floor(i/2)*88,23,C.white,500,'left',327)});txt('+ 文件夹转视频 / 文件夹清理',100,823,27,C.purple,600)});enter(q,.4,()=>{box(1020,210,800,650);txt('ComfyUI_design61_tools',1060,302,43,C.white,700,'left',720);txt('OPEN SOURCE · MIT',1060,357,23,C.cyan,600);g.strokeStyle=C.edge;g.lineWidth=2;g.beginPath();g.moveTo(1060,399);g.lineTo(1780,399);g.stroke();txt('github.com/design61',1060,484,37,C.white,600);txt('/ComfyUI_design61_tools',1060,537,33,C.cyan,600);txt('安装到 custom_nodes',1060,643,28,C.white,600);txt('重启 ComfyUI，刷新页面',1060,691,26,C.muted);txt('原版 H3 辅助节点 + 外部采样 / 放大',1060,762,24,C.muted);txt('初版 CPU 验证通过 · GPU 实测待验证',1060,811,23,C.gold)});txt('design61 · 个人自制与二改工具合集',100,943,24,C.muted)}
const scenes=[hero,sampling,sequence,media,folder,close];
window.renderAt=function(t){t=clamp(t,0,35.999);const i=Math.floor(t/6),q=t-i*6;g.save();bg(t,i);const alpha=Math.min(ease(q/.45),ease((6-q)/.45));g.globalAlpha=alpha;scenes[i](q);g.restore();return true};
let playing=!new URLSearchParams(location.search).has('render'),elapsed=0,previous=performance.now();const play=document.getElementById('play'),seek=document.getElementById('seek');play.textContent=playing?'暂停':'播放';
play.onclick=()=>{playing=!playing;if(elapsed>=36)elapsed=0;play.textContent=playing?'暂停':'播放'};seek.oninput=()=>{elapsed=+seek.value;window.renderAt(elapsed)};
function tick(now){const dt=(now-previous)/1000;previous=now;if(playing){elapsed+=dt;if(elapsed>=36){elapsed=36;playing=false;play.textContent='重播'}window.renderAt(elapsed)}seek.value=elapsed;document.getElementById('time').textContent='00:'+String(Math.floor(elapsed)).padStart(2,'0')+' / 00:36';requestAnimationFrame(tick)}window.renderAt(1);if(!new URLSearchParams(location.search).has('render'))requestAnimationFrame(tick);
</script></html>
